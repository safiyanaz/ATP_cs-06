<body>
  <div id="__bundler_placeholder">Loading Dexteria: your hands lead...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

3, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Bricolage Grotesque';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/bricolagegrotesque/v9/3y9K6as8bTXq_nANBjzKo3IeZx8z6up5BeSl9D4dj_x9PpZBMlGHInHEVA.woff2) format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Bricolage Grotesque';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/bricolagegrotesque/v9/3y9K6as8bTXq_nANBjzKo3IeZx8z6up5BeSl9D4dj_x9PpZBMlGGInHEVA.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Bricolage Grotesque';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"357bca6f-60c6-496f-997d-d986d18a86a3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#F2F1EC;color:#161B33;font-family:\"Atkinson Hyperlegible\",system-ui,sans-serif}\na{color:#0A6B5B}a:hover{color:#074D41}\n*{box-sizing:border-box}\n:focus-visible{outline:3px solid #F2A93B;outline-offset:3px}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height: 100vh; background: #F2F1EC; color: #161B33; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 18px; line-height: 1.6\" data-canvas-width=\"1440\" data-canvas-height=\"6200\" data-document-role=\"page\" data-label=\"Dexteria landing page\">\n\n<div style=\"background: #161B33; color: #E9ECFF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 24px\">\n<nav style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 28px; padding: 22px 0\" aria-label=\"Main\">\n<a href=\"#top\" style=\"display: flex; align-items: center; gap: 12px; color: #E9ECFF; text-decoration: none; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em\">\n<span aria-hidden=\"true\" style=\"display: grid; grid-template-columns: repeat(3, 8px); gap: 3px\">\n<span style=\"width: 8px; height: 8px; border-radius: 2px; background: #5FD3B8\"><\u002Fspan><span style=\"width: 8px; height: 8px; border-radius: 2px; background: #2B3366\"><\u002Fspan><span style=\"width: 8px; height: 8px; border-radius: 2px; background: #F2A93B\"><\u002Fspan>\n<span style=\"width: 8px; height: 8px; border-radius: 2px; background: #2B3366\"><\u002Fspan><span style=\"width: 8px; height: 8px; border-radius: 2px; background: #A7B0F7\"><\u002Fspan><span style=\"width: 8px; height: 8px; border-radius: 2px; background: #2B3366\"><\u002Fspan>\n<span style=\"width: 8px; height: 8px; border-radius: 2px; background: #F2A93B\"><\u002Fspan><span style=\"width: 8px; height: 8px; border-radius: 2px; background: #2B3366\"><\u002Fspan><span style=\"width: 8px; height: 8px; border-radius: 2px; background: #5FD3B8\"><\u002Fspan>\n<\u002Fspan>\nDexteria\n<\u002Fa>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px 26px; font-size: 16px\">\n<a href=\"#session\" style=\"color: #A9B0D6; text-decoration: none\">A session<\u002Fa>\n<a href=\"#never\" style=\"color: #A9B0D6; text-decoration: none\">Calm by design<\u002Fa>\n<a href=\"#kit\" style=\"color: #A9B0D6; text-decoration: none\">The kit<\u002Fa>\n<a href=\"#care\" style=\"color: #A9B0D6; text-decoration: none\">For caregivers<\u002Fa>\n<a href=\"#join\" style=\"color: #5FD3B8; text-decoration: none; font-weight: 700\">Join the pilot<\u002Fa>\n<\u002Fdiv>\n<\u002Fnav>\n\n<header id=\"top\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 56px; padding: 48px 0 96px\">\n<div style=\"flex: 1 1 460px; min-width: 0\">\n<p style=\"margin: 0 0 22px; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; color: #5FD3B8; font-weight: 700\">Hand practice, at home or in a care home<\u002Fp>\n<h1 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(48px, 7vw, 92px); line-height: 0.98; letter-spacing: -0.035em\">Your hands lead.<br><span style=\"color: #F2A93B\">The board follows.<\u002Fspan><\u002Fh1>\n<p style=\"margin: 28px 0 34px; font-size: 21px; color: #C4C9E8; max-width: 33em\">Dexteria turns a soft ball, a pen and a light-up board into game controllers for stroke survivors, people with Parkinson’s and older adults. Short, adult games. A record that keeps itself. No buzzers, no zeros, nothing toy-like.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<a href=\"#join\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 12px; background: #F2A93B; color: #1C1200; font-weight: 700; text-decoration: none\">Join the pilot list<\u002Fa>\n<a href=\"#session\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 12px; border: 2px solid #3A437A; color: #E9ECFF; font-weight: 700; text-decoration: none\">Walk through a session<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 380px; min-width: 0; max-width: 480px; margin: 0 auto\">\n<div style=\"background: #0E1226; border-radius: 32px; padding: 30px; border: 1px solid #2B3366\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 14px; color: #A9B0D6; letter-spacing: 0.08em; text-transform: uppercase\">\n<span>Copy the lights<\u002Fspan><span>Board · 3×3<\u002Fspan>\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"Board\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px\">\n<sc-for list=\"{{pegs}}\" as=\"peg\" hint-placeholder-count=\"9\">\n<button type=\"button\" sc-camel-on-click=\"{{peg.tap}}\" aria-label=\"{{peg.label}}\" style=\"aspect-ratio: 1; min-height: 64px; border: 0; border-radius: 24%; cursor: pointer; transition: background .25s, box-shadow .25s; background: {{peg.bg}}; box-shadow: {{peg.glow}}\"><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; margin-top: 24px\">\n<p role=\"status\" aria-live=\"polite\" style=\"margin: 0; flex: 1 1 180px; min-height: 1.6em; color: #E9ECFF\">{{status}}<\u002Fp>\n<button type=\"button\" sc-camel-on-click=\"{{go}}\" style=\"min-height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: #E9ECFF; color: #161B33; font: 700 16px 'Atkinson Hyperlegible', sans-serif; cursor: pointer\">{{goLabel}}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 14px 0 0; font-size: 15px; color: #A9B0D6; text-align: center\">A web preview. The real board has soft light and optional sound.<\u002Fp>\n<\u002Fdiv>\n<\u002Fheader>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<section style=\"border-bottom: 1px solid #D6D4CB\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 28px 24px; display: flex; flex-wrap: wrap; gap: 14px 40px; justify-content: space-between; font-size: 17px; color: #4A5070\">\n<span><b style=\"color: #161B33\">Stroke survivors<\u002Fb> fitting practice around therapy<\u002Fspan>\n<span><b style=\"color: #161B33\">People with Parkinson’s<\u002Fb> large targets, calm pace<\u002Fspan>\n<span><b style=\"color: #161B33\">Older adults<\u002Fb> busy fingers, alone or in a group<\u002Fspan>\n<span><b style=\"color: #161B33\">Care homes<\u002Fb> one kit, many residents<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"session\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px 72px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 20px 48px\">\n<h2 style=\"margin: 0; flex: 1 1 520px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(36px, 4.6vw, 60px); line-height: 1.02; letter-spacing: -0.03em\">Six minutes, start to finish.<\u002Fh2>\n<p style=\"margin: 0; flex: 1 1 320px; max-width: 30em; color: #4A5070\">Most people stop doing their hand exercises because the exercises are dull and the effort is invisible. A Dexteria session is short, varied, and shows you what you did.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"margin-top: 56px; display: flex; flex-direction: column; border-top: 2px solid #161B33\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 40px; padding: 26px 0; border-bottom: 1px solid #D6D4CB\">\n<span style=\"flex: 0 0 96px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; color: #8F4C08; font-variant-numeric: tabular-nums\">0:00<\u002Fspan>\n<h3 style=\"margin: 0; flex: 1 1 240px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; letter-spacing: -0.01em\">Tap your own photo<\u002Fh3>\n<p style=\"margin: 0; flex: 2 1 380px; color: #4A5070\">No typing, no passwords. In a care home, staff switch resident in two taps and each record stays separate.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 28px 40px; padding: 26px 0; border-bottom: 1px solid #D6D4CB\">\n<span style=\"flex: 0 0 96px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; color: #8F4C08; font-variant-numeric: tabular-nums\">0:30<\u002Fspan>\n<div style=\"flex: 1 1 240px; min-width: 0\">\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; letter-spacing: -0.01em\">Warm up: guide the lantern<\u002Fh3>\n<p style=\"margin: 12px 0 0; color: #4A5070; max-width: 26em\">Squeeze the ball gently and the lantern glows. Five seconds, ten times. You never need to squeeze as hard as you can, and letting go early is simply a rest.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 2 1 380px; min-width: 0; background: #161B33; color: #E9ECFF; border-radius: 28px; padding: 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 28px 40px\">\n<div style=\"flex: 0 0 auto; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px\">\n<div aria-hidden=\"true\" style=\"width: 4px; height: 26px; background: #3A437A\"><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"width: 120px; height: 168px; border-radius: 42% 42% 34% 34%; display: grid; place-items: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; color: {{lampInk}}; background: {{lampBg}}; box-shadow: {{lampGlow}}\">{{secs}}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<p role=\"status\" aria-live=\"polite\" style=\"margin: 0; min-height: 3.2em\">{{holdMsg}}<\u002Fp>\n<button type=\"button\" sc-camel-on-pointer-down=\"{{holdDown}}\" sc-camel-on-pointer-up=\"{{holdUp}}\" sc-camel-on-pointer-leave=\"{{holdUp}}\" sc-camel-on-pointer-cancel=\"{{holdUp}}\" sc-camel-on-key-down=\"{{holdKeyDown}}\" sc-camel-on-key-up=\"{{holdKeyUp}}\" style=\"min-height: 56px; border: 0; border-radius: 14px; background: #5FD3B8; color: #08201A; font: 700 18px 'Atkinson Hyperlegible', sans-serif; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none\">{{holdLabel}}<\u002Fbutton>\n<div aria-hidden=\"true\" style=\"display: flex; gap: 7px; flex-wrap: wrap\">\n<sc-for list=\"{{dots}}\" as=\"dot\" hint-placeholder-count=\"10\">\n<span style=\"width: 16px; height: 16px; border-radius: 50%; background: {{dot.bg}}\"><\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 40px; padding: 26px 0; border-bottom: 1px solid #D6D4CB\">\n<span style=\"flex: 0 0 96px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; color: #8F4C08; font-variant-numeric: tabular-nums\">2:30<\u002Fspan>\n<h3 style=\"margin: 0; flex: 1 1 240px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; letter-spacing: -0.01em\">Copy the lights<\u002Fh3>\n<p style=\"margin: 0; flex: 2 1 380px; color: #4A5070\">The board plays a short pattern; you touch it back. Then sort by colour or symbol. Large and guided first, smaller targets and longer patterns as you are ready. (It’s the game at the top of this page.)<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 40px; padding: 26px 0; border-bottom: 1px solid #D6D4CB\">\n<span style=\"flex: 0 0 96px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; color: #8F4C08; font-variant-numeric: tabular-nums\">4:00<\u002Fspan>\n<h3 style=\"margin: 0; flex: 1 1 240px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; letter-spacing: -0.01em\">Trace your name<\u002Fh3>\n<p style=\"margin: 0; flex: 2 1 380px; color: #4A5070\">A chunky stylus on the writing pad: shapes, then letters, then the name on a birthday card for a grandchild.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 40px; padding: 26px 0; border-bottom: 1px solid #D6D4CB\">\n<span style=\"flex: 0 0 96px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; color: #0A6B5B; font-variant-numeric: tabular-nums\">6:00<\u002Fspan>\n<h3 style=\"margin: 0; flex: 1 1 240px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; letter-spacing: -0.01em\">Done. The day counts.<\u002Fh3>\n<p style=\"margin: 0; flex: 2 1 380px; color: #4A5070\">The app logs time, holds and patterns quietly in the background. Pause or stop at any point; tired hands and sore days are part of the plan.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"never\" style=\"background: #E6E4DC\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px\">\n<h2 style=\"margin: 0; max-width: 14em; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(36px, 4.6vw, 60px); line-height: 1.02; letter-spacing: -0.03em\">Six things the board will never do.<\u002Fh2>\n<div style=\"margin-top: 52px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 48px\">\n<div style=\"padding: 24px 0; border-top: 1px solid #C9C6BA\">\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px\">Buzz at a wrong move.<\u002Fh3>\n<p style=\"margin: 8px 0 0; color: #4A5070\">It gently replays the pattern. Scoring happens out of sight.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 24px 0; border-top: 1px solid #C9C6BA\">\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px\">Show you a zero.<\u002Fh3>\n<p style=\"margin: 8px 0 0; color: #4A5070\">Rest days protect your streak. If it breaks, you see your total practice days and a warm welcome back.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 24px 0; border-top: 1px solid #C9C6BA\">\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px\">Say you failed.<\u002Fh3>\n<p style=\"margin: 8px 0 0; color: #4A5070\">Levels ease down on their own, without announcing it.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 24px 0; border-top: 1px solid #C9C6BA\">\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px\">Rush you.<\u002Fh3>\n<p style=\"margin: 8px 0 0; color: #4A5070\">If someone hesitates for long or taps at random, light and sound soften and a calm activity is offered.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 24px 0; border-top: 1px solid #C9C6BA\">\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px\">Ask for your hardest squeeze.<\u002Fh3>\n<p style=\"margin: 8px 0 0; color: #4A5070\">The ball rewards a steady, comfortable hold, not maximum force.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 24px 0; border-top: 1px solid #C9C6BA\">\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px\">Make you wear anything.<\u002Fh3>\n<p style=\"margin: 8px 0 0; color: #4A5070\">Camera tracking is the default. The sensor glove is optional, and later.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"kit\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 20px 48px\">\n<h2 style=\"margin: 0; flex: 1 1 480px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(36px, 4.6vw, 60px); line-height: 1.02; letter-spacing: -0.03em\">Ordinary objects, quietly clever.<\u002Fh2>\n<p style=\"margin: 0; flex: 1 1 320px; max-width: 30em; color: #4A5070\">We start with four parts and add more only after testing with real elders, therapists and caregivers.<\u002Fp>\n<\u002Fdiv>\n<div style=\"margin-top: 48px; border-top: 2px solid #161B33\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 4px 32px; padding: 22px 0; border-bottom: 1px solid #D6D4CB; align-items: baseline\">\n<span style=\"flex: 0 0 48px; color: #4A5070; font-variant-numeric: tabular-nums\">01<\u002Fspan>\n<h3 style=\"margin: 0; flex: 1 1 220px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px\">Smart Board<\u002Fh3>\n<p style=\"margin: 0; flex: 3 1 360px; color: #4A5070\">Light-up cells in 3×3 or 4×4, soft sound and a tablet dock. Patterns, colour and symbol sorting.<\u002Fp>\n<span style=\"flex: 0 0 auto; padding: 2px 12px; border-radius: 99px; background: #D3EFE7; color: #074D41; font-size: 15px; font-weight: 700\">Phase 1<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 4px 32px; padding: 22px 0; border-bottom: 1px solid #D6D4CB; align-items: baseline\">\n<span style=\"flex: 0 0 48px; color: #4A5070; font-variant-numeric: tabular-nums\">02<\u002Fspan>\n<h3 style=\"margin: 0; flex: 1 1 220px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px\">Pressure ball<\u002Fh3>\n<p style=\"margin: 0; flex: 3 1 360px; color: #4A5070\">Soft in the hand. Senses squeeze strength and hold time, so a steady grip can be seen and celebrated.<\u002Fp>\n<span style=\"flex: 0 0 auto; padding: 2px 12px; border-radius: 99px; background: #D3EFE7; color: #074D41; font-size: 15px; font-weight: 700\">Phase 1<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 4px 32px; padding: 22px 0; border-bottom: 1px solid #D6D4CB; align-items: baseline\">\n<span style=\"flex: 0 0 48px; color: #4A5070; font-variant-numeric: tabular-nums\">03<\u002Fspan>\n<h3 style=\"margin: 0; flex: 1 1 220px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px\">Writing pad<\u002Fh3>\n<p style=\"margin: 0; flex: 3 1 360px; color: #4A5070\">A tablet and a thick stylus for tracing shapes, letters and names.<\u002Fp>\n<span style=\"flex: 0 0 auto; padding: 2px 12px; border-radius: 99px; background: #D3EFE7; color: #074D41; font-size: 15px; font-weight: 700\">Phase 1<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 4px 32px; padding: 22px 0; border-bottom: 1px solid #D6D4CB; align-items: baseline\">\n<span style=\"flex: 0 0 48px; color: #4A5070; font-variant-numeric: tabular-nums\">04<\u002Fspan>\n<h3 style=\"margin: 0; flex: 1 1 220px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px\">Companion app<\u002Fh3>\n<p style=\"margin: 0; flex: 3 1 360px; color: #4A5070\">Free. Photo profiles, games, the weekly record and caregiver controls. Works offline.<\u002Fp>\n<span style=\"flex: 0 0 auto; padding: 2px 12px; border-radius: 99px; background: #D3EFE7; color: #074D41; font-size: 15px; font-weight: 700\">Phase 1<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 4px 32px; padding: 22px 0; border-bottom: 1px solid #D6D4CB; align-items: baseline\">\n<span style=\"flex: 0 0 48px; color: #4A5070; font-variant-numeric: tabular-nums\">05<\u002Fspan>\n<h3 style=\"margin: 0; flex: 1 1 220px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px\">Coins, cards and blocks<\u002Fh3>\n<p style=\"margin: 0; flex: 3 1 360px; color: #4A5070\">Sort tokens, turn cards, match familiar family photos.<\u002Fp>\n<span style=\"flex: 0 0 auto; padding: 2px 12px; border-radius: 99px; background: #F6E2C4; color: #6B3905; font-size: 15px; font-weight: 700\">Phase 2<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 4px 32px; padding: 22px 0; border-bottom: 1px solid #D6D4CB; align-items: baseline\">\n<span style=\"flex: 0 0 48px; color: #4A5070; font-variant-numeric: tabular-nums\">06<\u002Fspan>\n<h3 style=\"margin: 0; flex: 1 1 220px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px\">Towel and daily items<\u002Fh3>\n<p style=\"margin: 0; flex: 3 1 360px; color: #4A5070\">Scrunch a towel, stir a spoon, fasten a button strip: the movements of an ordinary morning.<\u002Fp>\n<span style=\"flex: 0 0 auto; padding: 2px 12px; border-radius: 99px; background: #F6E2C4; color: #6B3905; font-size: 15px; font-weight: 700\">Phase 2<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 4px 32px; padding: 22px 0; border-bottom: 1px solid #D6D4CB; align-items: baseline\">\n<span style=\"flex: 0 0 48px; color: #4A5070; font-variant-numeric: tabular-nums\">07<\u002Fspan>\n<h3 style=\"margin: 0; flex: 1 1 220px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px\">Smart glove<\u002Fh3>\n<p style=\"margin: 0; flex: 3 1 360px; color: #4A5070\">Optional finger sensing for those who want more detail.<\u002Fp>\n<span style=\"flex: 0 0 auto; padding: 2px 12px; border-radius: 99px; background: #E0E3FA; color: #2F3790; font-size: 15px; font-weight: 700\">Phase 3<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 4px 32px; padding: 22px 0; border-bottom: 1px solid #D6D4CB; align-items: baseline\">\n<span style=\"flex: 0 0 48px; color: #4A5070; font-variant-numeric: tabular-nums\">08<\u002Fspan>\n<h3 style=\"margin: 0; flex: 1 1 220px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px\">Warm-down glove<\u002Fh3>\n<p style=\"margin: 0; flex: 3 1 360px; color: #4A5070\">Starts as a removable warm pack with no electronics, until safety testing is done.<\u002Fp>\n<span style=\"flex: 0 0 auto; padding: 2px 12px; border-radius: 99px; background: #E0E3FA; color: #2F3790; font-size: 15px; font-weight: 700\">Phase 3<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"care\" style=\"background: #FFFFFF; border-top: 1px solid #D6D4CB; border-bottom: 1px solid #D6D4CB\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center\">\n<div style=\"flex: 1 1 440px; min-width: 0\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(36px, 4.6vw, 56px); line-height: 1.02; letter-spacing: -0.03em\">A clear week for the person helping.<\u002Fh2>\n<p style=\"margin: 20px 0 0; color: #4A5070; max-width: 32em\">Families and care staff see time, holds and patterns at a glance, and share a one-page summary with a physio, OT or doctor.<\u002Fp>\n<div style=\"margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px 36px\">\n<div><h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 21px\">Controls behind a PIN<\u002Fh3><p style=\"margin: 6px 0 0; color: #4A5070; font-size: 17px\">Levels, speed, sound and brightness stay with the caregiver.<\u002Fp><\u002Fdiv>\n<div><h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 21px\">Your data, your say<\u002Fh3><p style=\"margin: 6px 0 0; color: #4A5070; font-size: 17px\">Consent per profile. Deleting a record needs a caregiver’s PIN.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div aria-label=\"Sample weekly summary\" style=\"flex: 1 1 400px; min-width: 0; background: #F2F1EC; border: 1px solid #D6D4CB; border-radius: 24px; padding: 30px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px\">\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px\">Alex’s week<\u002Fh3>\n<span style=\"font-size: 14px; color: #8F4C08; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase\">Sample data<\u002Fspan>\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"display: flex; align-items: flex-end; gap: 10px; height: 150px; margin: 26px 0 10px\">\n<span style=\"flex: 1; height: 55%; border-radius: 8px 8px 3px 3px; background: #0A6B5B\"><\u002Fspan>\n<span style=\"flex: 1; height: 70%; border-radius: 8px 8px 3px 3px; background: #0A6B5B\"><\u002Fspan>\n<span style=\"flex: 1; height: 8px; border-radius: 3px; background: #C9C6BA\"><\u002Fspan>\n<span style=\"flex: 1; height: 62%; border-radius: 8px 8px 3px 3px; background: #0A6B5B\"><\u002Fspan>\n<span style=\"flex: 1; height: 80%; border-radius: 8px 8px 3px 3px; background: #0A6B5B\"><\u002Fspan>\n<span style=\"flex: 1; height: 8px; border-radius: 3px; background: #C9C6BA\"><\u002Fspan>\n<span style=\"flex: 1; height: 74%; border-radius: 8px 8px 3px 3px; background: #0A6B5B\"><\u002Fspan>\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"display: flex; gap: 10px; color: #4A5070; font-size: 14px\">\n<span style=\"flex: 1; text-align: center\">Mon<\u002Fspan><span style=\"flex: 1; text-align: center\">Tue<\u002Fspan><span style=\"flex: 1; text-align: center\">Wed<\u002Fspan><span style=\"flex: 1; text-align: center\">Thu<\u002Fspan><span style=\"flex: 1; text-align: center\">Fri<\u002Fspan><span style=\"flex: 1; text-align: center\">Sat<\u002Fspan><span style=\"flex: 1; text-align: center\">Sun<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin: 8px 0 0; font-size: 14px; color: #4A5070\">Grey days are rest days. They keep the streak.<\u002Fp>\n<div style=\"margin-top: 22px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px\">\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 14px 16px\"><b style=\"display: block; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px\">5 of 7<\u002Fb><span style=\"color: #4A5070; font-size: 15px\">Days practised<\u002Fspan><\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 14px 16px\"><b style=\"display: block; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px\">6.2 s<\u002Fb><span style=\"color: #4A5070; font-size: 15px\">Longest steady hold<\u002Fspan><\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 14px 16px\"><b style=\"display: block; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px\">83%<\u002Fb><span style=\"color: #4A5070; font-size: 15px\">Patterns matched<\u002Fspan><\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 14px 16px\"><b style=\"display: block; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px\">2.4 s<\u002Fb><span style=\"color: #4A5070; font-size: 15px\">Response to a cue<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 18px 0 0; font-size: 15px; color: #4A5070\">Suggestion: keep the comfortable six-minute routine. A caregiver approves every change. Engagement measures, not clinical ones.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px 72px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(32px, 3.8vw, 48px); line-height: 1.05; letter-spacing: -0.03em\">How we’ll build it<\u002Fh2>\n<div style=\"margin-top: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px 36px\">\n<div style=\"border-top: 4px solid #0A6B5B; padding-top: 18px\">\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px\">1 · The core<\u002Fh3>\n<p style=\"margin: 8px 0 0; color: #4A5070; font-size: 17px\">Board, pressure ball, writing pad and app: profiles, levels, forgiving streaks, caregiver view.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 4px solid #B5650F; padding-top: 18px\">\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px\">2 · Everyday objects<\u002Fh3>\n<p style=\"margin: 8px 0 0; color: #4A5070; font-size: 17px\">Coins, cards, blocks, towel and daily items, camera hand tracking, calm mode, local languages.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 4px solid #4B54C4; padding-top: 18px\">\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px\">3 · Extras<\u002Fh3>\n<p style=\"margin: 8px 0 0; color: #4A5070; font-size: 17px\">Smart and warm-down gloves, play together at a distance, mirror sessions, a therapist PDF.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"join\" style=\"max-width: 1200px; margin: 0 auto; padding: 24px 24px 72px\">\n<div style=\"background: #161B33; color: #E9ECFF; border-radius: 32px; padding: clamp(28px, 5vw, 60px); display: flex; flex-wrap: wrap; gap: 36px 56px; align-items: center\">\n<div style=\"flex: 1 1 420px; min-width: 0\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(34px, 4.2vw, 54px); line-height: 1.02; letter-spacing: -0.03em\">Help us get it right.<\u002Fh2>\n<p style=\"margin: 16px 0 0; color: #C4C9E8; max-width: 30em\">We are a student team testing ideas with therapists, care staff and caregivers. Join the list to try early designs and tell us what would actually help.<\u002Fp>\n<\u002Fdiv>\n<form sc-camel-on-submit=\"{{submit}}\" style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<label for=\"em\" style=\"font-weight: 700\">Email address<\u002Flabel>\n<input id=\"em\" type=\"email\" autocomplete=\"email\" placeholder=\"you@example.com\" required=\"required\" style=\"font: inherit; min-height: 52px; padding: 0 16px; border-radius: 12px; border: 2px solid #3A437A; background: #0E1226; color: #E9ECFF\">\n<button type=\"submit\" style=\"min-height: 52px; border: 0; border-radius: 12px; background: #F2A93B; color: #1C1200; font: 700 18px 'Atkinson Hyperlegible', sans-serif; cursor: pointer\">Join the pilot list<\u002Fbutton>\n<p role=\"status\" aria-live=\"polite\" style=\"margin: 0; min-height: 1.5em; color: #5FD3B8\">{{thx}}<\u002Fp>\n<\u002Fform>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"max-width: 1200px; margin: 0 auto; padding: 8px 24px 64px\">\n<p style=\"margin: 0; max-width: 60em; font-size: 16px; color: #4A5070\"><b style=\"color: #161B33\">Concept page.<\u002Fb> Dexteria is a student project, not yet a product. It supports practice and engagement. It does not diagnose, treat or cure any condition, and does not replace advice from a health professional. Figures shown are sample data.<\u002Fp>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:6200}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.T = []; this.raf = 0; this.t0 = 0; this.holding = false;\n    this.state = {\n      seq: [], pos: 0, mode: 'idle', lit: [],\n      status: 'Watch the lights, then touch them in the same order.',\n      goLabel: 'Show pattern',\n      holdP: 0, reps: 0, holdMsg: 'Hold gently for five seconds.', isHolding: false,\n      thx: ''\n    };\n  }\n  componentWillUnmount() { this.clearT(); cancelAnimationFrame(this.raf); }\n  later(f, m) { this.T.push(setTimeout(f, m)); }\n  clearT() { this.T.forEach(clearTimeout); this.T = []; }\n  show(seq) {\n    this.clearT();\n    this.setState({ seq: seq, mode: 'show', pos: 0, lit: [], status: 'Watch the lights.' });\n    seq.forEach((n, k) => {\n      this.later(() => this.setState({ lit: [n] }), k * 800 + 300);\n      this.later(() => this.setState({ lit: [] }), k * 800 + 750);\n    });\n    this.later(() => this.setState({ mode: 'in', status: 'Your turn. Touch the same order.' }), seq.length * 800 + 400);\n  }\n  fresh() {\n    var s = [];\n    while (s.length < 3) { var n = Math.floor(Math.random() * 9); if (s.indexOf(n) < 0) s.push(n); }\n    this.show(s);\n  }\n  tap(n) {\n    var st = this.state;\n    if (st.mode !== 'in') return;\n    if (n === st.seq[st.pos]) {\n      var pos = st.pos + 1, lit = st.lit.concat([n]);\n      if (pos === st.seq.length) {\n        this.setState({ lit: lit, pos: pos, mode: 'done', status: 'Pattern copied. Nicely done.', goLabel: 'New pattern' });\n        this.later(() => this.setState({ lit: [] }), 1200);\n      } else {\n        this.setState({ lit: lit, pos: pos });\n      }\n    } else {\n      var s = st.seq;\n      this.setState({ mode: 'show', lit: [n], status: 'No rush. Here it is again.' });\n      this.later(() => this.show(s), 1000);\n    }\n  }\n  begin() {\n    if (this.holding) return;\n    this.holding = true;\n    this.t0 = performance.now();\n    var reps = this.state.reps >= 10 ? 0 : this.state.reps;\n    this.setState({ reps: reps, isHolding: true, holdMsg: 'Hold gently. Keep it comfortable.' });\n    var step = () => {\n      if (!this.holding) return;\n      var p = Math.min((performance.now() - this.t0) / 5000, 1);\n      this.setState({ holdP: p });\n      if (p >= 1) { this.finish(true); return; }\n      this.raf = requestAnimationFrame(step);\n    };\n    this.raf = requestAnimationFrame(step);\n  }\n  finish(ok) {\n    if (!this.holding) return;\n    this.holding = false;\n    cancelAnimationFrame(this.raf);\n    if (ok) {\n      var r = this.state.reps + 1;\n      this.setState({ isHolding: false, reps: r, holdMsg: r >= 10 ? 'All ten holds done. A steady glow.' : r + ' of 10 holds. Rest, then go again.' });\n    } else {\n      this.setState({ isHolding: false, holdMsg: 'Let go any time. That was a rest, not a miss.' });\n    }\n    setTimeout(() => { if (!this.holding) this.setState({ holdP: 0 }); }, ok ? 900 : 250);\n  }\n  renderVals() {\n    var st = this.state;\n    var glow = ['#5FD3B8', '#F2A93B', '#A7B0F7'];\n    var pegs = [];\n    for (var i = 0; i < 9; i++) {\n      (function (self, n) {\n        var on = st.lit.indexOf(n) >= 0, c = glow[n % 3];\n        pegs.push({\n          label: 'Cell ' + (n + 1),\n          bg: on ? c : '#2B3366',\n          glow: on ? '0 0 0 6px ' + c + '33, 0 0 32px ' + c : 'inset 0 -4px 0 rgba(0,0,0,0.25)',\n          tap: function () { self.tap(n); }\n        });\n      })(this, i);\n    }\n    var pct = Math.round(st.holdP * 100);\n    var dots = [];\n    for (var j = 0; j < 10; j++) dots.push({ bg: j < st.reps ? '#5FD3B8' : '#2B3366' });\n    return {\n      pegs: pegs,\n      status: st.status,\n      goLabel: st.goLabel,\n      go: () => this.fresh(),\n      lampBg: 'color-mix(in srgb, #F2A93B ' + pct + '%, #2B3366)',\n      lampGlow: '0 0 ' + Math.round(pct * 0.7) + 'px ' + Math.round(pct * 0.1) + 'px rgba(242,169,59,' + (pct / 140).toFixed(2) + ')',\n      lampInk: pct > 45 ? '#1C1200' : '#E9ECFF',\n      secs: (st.holdP * 5).toFixed(1),\n      holdMsg: st.holdMsg,\n      holdLabel: st.isHolding ? 'Keep holding' : (st.reps >= 10 ? 'Start again' : 'Press and hold'),\n      dots: dots,\n      holdDown: (e) => { if (e && e.preventDefault) e.preventDefault(); this.begin(); },\n      holdUp: () => this.finish(false),\n      holdKeyDown: (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); this.begin(); } },\n      holdKeyUp: (e) => { if (e.key === ' ' || e.key === 'Enter') this.finish(false); },\n      submit: (e) => { e.preventDefault(); this.setState({ thx: 'Thank you. This is a concept page, so nothing was sent.' }); },\n      thx: st.thx\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
